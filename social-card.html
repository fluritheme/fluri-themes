<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: DM;
        src: url("/fonts/dm-sans-latin.woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e1ff36;
        color: #0c0e0d;
        font-family: DM, Arial;
        width: 1200px;
        height: 630px;
        padding: 40px 52px;
        overflow: hidden;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font: 11px monospace;
        letter-spacing: 1px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font: 700 35px DM;
        letter-spacing: -2px;
      }
      .brand img {
        height: 54px;
        width: 54px;
        border-radius: 8px;
      }
      .brand small {
        display: block;
        font: 8px monospace;
        letter-spacing: 2px;
        margin-top: 3px;
      }
      h1 {
        font-size: 151px;
        line-height: 0.88;
        letter-spacing: -11px;
        font-weight: 850;
        margin: 58px 0 48px;
      }
      h1 span {
        font-weight: 500;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        font: 11px/1.5 monospace;
      }
      nav {
        display: flex;
        gap: 10px;
      }
      nav span {
        padding: 10px 18px;
        background: #4935f5;
        color: white;
      }
      nav span:last-child {
        background: #ff572d;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/brand-mark-128.png" />
        <div>fluri<small>THEMES</small></div>
      </div>
      <span>INDEPENDENT. OPEN SOURCE. A LITTLE DIFFERENT.</span>
    </header>
    <h1>SMALL CODE.<br /><span>BIG FEELING.</span></h1>
    <footer>
      <span>WEBSITE EFFECTS BY FRANTIŠEK GEJDOŠ<br />FLURI.XYZ ↗</span>
      <nav><span>01 / WINTER</span><span>02 / SPIDER</span></nav>
    </footer>
  </body>
</html>
